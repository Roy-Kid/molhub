# QM9, from the Springer Nature Figshare collection 978904.
#
# The locators pin an article *version*. A bare `figshare://1057646` resolves to
# whatever is current -- that article already has a v1 and a v2 -- so an
# unpinned manifest would start serving a new release the day one appears, with
# nothing to show for it. The per-article DOIs noted below identify exactly the
# versions pinned here.
#
# They also resolve through the Figshare API rather than a raw ndownloader URL.
# That endpoint answers 202 with an empty body while preparing a file, and this
# project's own history includes that response being cached as a valid 0-byte
# exclusion list -- silently turning 130,831 characterised molecules into
# 133,885.

kind: dataset
namespace: molcrafts
name: qm9
version: v2

title: QM9 — 133,885 small organic molecules with quantum-chemical properties
description: >-
  DFT-computed geometries and 15 scalar properties for the GDB-9 subset of
  small organic molecules with up to nine heavy atoms (C, N, O, F). The
  uncharacterized list names the 3,054 molecules that failed the geometry
  consistency check, leaving 130,831 usable entries.
license: CC0-1.0
doi: 10.1038/sdata.2014.22

artifacts:
  - role: main
    # doi:10.6084/m9.figshare.978904_D12 — article 1057646, version 2
    filename: dsgdb9nsd.xyz.tar.bz2
    digest: md5:ad1ebd51ee7f5b3a6e32e974e5d54012
    size: 86144227
    locators:
      - figshare://1057646/v2/dsgdb9nsd.xyz.tar.bz2

  - role: exclude
    # doi:10.6084/m9.figshare.978904_D10 — article 1057644, version 1
    filename: uncharacterized.txt
    digest: md5:a361887bacb427b8a0ce7903d92a53b4
    size: 486752
    locators:
      - figshare://1057644/v1/uncharacterized.txt

targets:
  graph_level:
    [A, B, C, mu, alpha, homo, lumo, gap, r2, zpve, U0, U, H, G, Cv]
  atom_level: []
