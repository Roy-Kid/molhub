# revMD17 (rMD17), Figshare article 12672038, version 4.
#
# Upstream shape, read off the API rather than guessed: v1 and v2 published only
# the 1 GB `rmd17.tar.bz2`; v3 added a readme; v4 additionally publishes each
# molecule's `.npz` as its own downloadable file. So one manifest with one role
# per molecule is the honest shape -- ten manifests would invent ten dataset
# names for what upstream calls one dataset with one DOI, and a single `main`
# archive role would make reading aspirin cost a gigabyte.
#
# The locators pin `/v4/`. A bare `figshare://12672038` resolves to whatever is
# current, and this article has already moved four times.
#
# The archive `rmd17.tar.bz2` and the train/test split files (`splits.zip`,
# `index_{train,test}_0N.csv`) are also in v4 and are deliberately not
# catalogued here: the archive duplicates the ten roles below, and nothing in
# molhub consumes the splits yet. Add roles when something does.
kind: dataset
namespace: molcrafts
name: revmd17
version: v4

title: revMD17 — MD17 trajectories recomputed at PBE/def2-SVP
description: >-
  100,000 configurations for each of ten small organic molecules, taken from
  the original MD17 trajectories and recomputed at the PBE/def2-SVP level with
  tight SCF convergence and a dense integration grid, so the labels are
  practically free of numerical noise. Energies are in kcal/mol and forces in
  kcal/mol/angstrom. Azobenzene carries 99,988 configurations -- 11 DFT
  calculations failed on van der Waals clashes and the original trajectory held
  99,999. The structures are consecutive MD samples and are not independent;
  upstream warns against training on more than 1,000 of them.
license: CC0-1.0
doi: 10.6084/m9.figshare.12672038.v4

