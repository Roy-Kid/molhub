# Curated entry for the LAMALAB polymer glass-transition dataset.
#
# The digest below is the md5 Zenodo publishes for this file, copied verbatim.
# molhub never computes a digest of its own: a self-computed value would only
# record what one download happened to contain, and requiring one would mean
# hauling every artifact before it could be catalogued.
#
# What pins the version is the record id -- a Zenodo record id *is* a version,
# and its files are immutable after publication -- together with the DOI. The
# digest is the secondary cross-check that Zenodo kept that promise.

kind: dataset
namespace: molcrafts
name: polymer-tg
version: "1"

title: LAMALAB curated polymer glass-transition temperatures
description: >-
  Experimentally measured glass-transition temperatures for polymers, given as
  PSMILES plus Tg in kelvin, curated by LAMALAB.
license: CC-BY-4.0
doi: 10.5281/zenodo.14980914

artifacts:
  - role: main
    filename: LAMALAB_CURATED_Tg_structured.csv
    digest: md5:ce2c7b2a879450cbbfff4d7ccea648f9
    size: 6024335
    locators:
      - zenodo://14980914/LAMALAB_CURATED_Tg_structured.csv

targets:
  graph_level:
    - labels.Exp_Tg(K)
  atom_level: []
