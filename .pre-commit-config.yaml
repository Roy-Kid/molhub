# Managed by prek: `prek install`
# CI parity: same shell commands as .github/workflows/ci.yml (no tox wrapper).
# tox remains in [project.optional-dependencies] dev for optional local isolation.
#
# Do not push until `prek run --all-files --stage pre-push` is green. Registry
# schema and npm audit failures must fail here, not only on GitHub.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^packages/registry-tools/test/fixtures/malformed-yaml/
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: ^vendor/molcrafts-molvis-stage-0\.2\.0\.tgz$
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: ci-lint
        name: "CI lint (same as ci.yml)"
        entry: bash -c 'uv sync --extra dev && uv run ruff check src/ tests/ && uv run ruff format --check src/ tests/ && uv run ty check src/'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: ci-node
        name: "CI node + registry (same as ci.yml)"
        entry: bash -c 'set -euo pipefail; REGISTRY_ROOT="${MOLHUB_REGISTRY_ROOT:-$PWD/../molhub-registry}"; test -d "$REGISTRY_ROOT/artifacts" || { echo "Missing $REGISTRY_ROOT/artifacts" >&2; exit 1; }; npm ci; npm run security:audit; npm run registry:layout -- "$REGISTRY_ROOT"; npm run registry:validate -- "$REGISTRY_ROOT/artifacts"; npm run registry:build -- "$REGISTRY_ROOT/artifacts" "$REGISTRY_ROOT/dist"; export MOLHUB_REGISTRY_JSON="$REGISTRY_ROOT/dist/registry.json"; npm run check'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ci-test
        name: "CI test (same as ci.yml)"
        entry: bash -c 'uv sync --extra dev && uv run pytest --cov=src/molhub --cov-report=xml -v'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
