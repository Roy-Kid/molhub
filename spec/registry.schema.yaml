# JSON Schema for the aggregate molhub registry, written in YAML.
#
# `spec/manifest.schema.yaml` describes one artifact as a human writes it.
# This describes what `packages/registry-tools` makes of the whole registry:
# the single `dist/registry.json` consumers can retrieve instead of walking a
# directory tree over HTTP. The product Web bakes one explicit snapshot into
# each build.
#
# The two are deliberately different documents, not one document reused:
#
#   * A manifest is *authored*. Optional fields are genuinely absent, comments
#     carry the reasoning, and the coordinate lives in the file path.
#   * A registry entry is *generated*. Every field is present — an omitted one
#     becomes `null` — the coordinate is materialised as a string, and the
#     ordering is fixed so that rebuilding an unchanged registry produces a
#     byte-identical file and the deploy diff stays readable.
#
# Making the reader distinguish "key missing" from "value not published" would
# buy nothing and cost every consumer an extra branch, so this schema requires
# every key and makes the nullable ones explicitly nullable.
#
# TypeScript types and runtime schema bundles are generated from this contract.
# The registry builder validates its own output against this file before writing.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://molcrafts.org/schema/molhub/registry/1"
title: molhub aggregate registry
type: object
additionalProperties: false

required: [entries]

properties:
  entries:
    description: >-
      Every manifest in the registry, ordered by `coordinate` and by nothing
      else. Order is part of the contract because it is what makes the build
      reproducible; a consumer that wants another order sorts a copy.

      May be empty: a registry with no entries is a real state (a fresh fork, a
      registry mid-migration) and should build rather than fail. Emptiness is
      the site's problem to render, not the schema's to forbid.
    type: array
    items: { $ref: "#/$defs/entry" }

$defs:
  segment:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"

  entry:
    type: object
    additionalProperties: false
    required:
      [
        coordinate,
        kind,
        namespace,
        name,
        version,
        title,
        description,
        license,
        doi,
        targets,
        artifacts,
      ]

    properties:
      coordinate:
        description: >-
          The canonical `kind:namespace/name@version`, spelled out in full and
          unique across the registry. Redundant with the four fields below, and
          kept anyway: it is the string a user types, the key a consumer joins
          on, and the anchor a URL is built from. Recomputing it in every
          client is how the four spellings start to drift apart.
        type: string
        pattern: "^(dataset|model|plugin):[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*@[A-Za-z0-9][A-Za-z0-9._-]*$"

      kind:
        enum: [dataset, model, plugin]

      namespace:
        $ref: "#/$defs/segment"

      name:
        $ref: "#/$defs/segment"

      version:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"

      title:
        type: string
        minLength: 1

      description:
        description: Free prose, or `null` when the manifest wrote none.
        type: [string, "null"]

      license:
        description: SPDX identifier, e.g. CC0-1.0, or `null` when unstated.
        type: [string, "null"]

      doi:
        description: >-
          The persistent identifier for exactly this version. Nullable in the
          schema because the shape must be describable before it is
          policed — the shared `ManifestValidator` refuses a null one, and it
          refuses with an explanation a contributor can act on. A type error
          here would only say "expected string".
        type: [string, "null"]
        pattern: "^10[.][0-9]{4,}/.+$"

      targets:
        description: >-
          Declarative only, and always present: a manifest that omits the block
          becomes two empty lists rather than a missing key, so a consumer can
          map over it without a guard. Nothing in the fetch path reads this.
        type: object
        additionalProperties: false
        required: [graph_level, atom_level]
        properties:
          graph_level: { type: array, items: { type: string } }
          atom_level: { type: array, items: { type: string } }

      artifacts:
        description: >-
          At least one, ordered by `role`. A manifest with no downloadable file
          names nothing and is rejected upstream by the manifest schema.
        type: array
        minItems: 1
        items: { $ref: "#/$defs/artifact" }

  artifact:
    type: object
    additionalProperties: false
    required: [role, filename, format, media_type, locators, digest, size]

    # The manifest schema's `anyOf: [required digest, required size]` restated
    # for a document where neither key can be absent: at least one of the two
    # must carry a value. Both null would leave a completed transfer with
    # nothing at all to be compared against.
    anyOf:
      - properties: { digest: { type: string } }
      - properties: { size: { type: integer } }

    properties:
      role:
        description: How consumers refer to this file -- main, exclude, weights...
        type: string
        minLength: 1

      filename:
        type: string
        minLength: 1

      format:
        description: Stable byte-format identifier, or `null` when not declared.
        oneOf:
          - { type: "null" }
          - { type: string, pattern: "^[a-z0-9][a-z0-9._+-]*$" }

      media_type:
        description: IANA-style media type without parameters, or `null`.
        oneOf:
          - { type: "null" }
          - { type: string, pattern: "^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$" }

      locators:
        description: >-
          Ordered candidate sources; earlier entries are preferred. Copied from
          the manifest unchanged -- the build resolves nothing and rewrites
          nothing, so what a user reads here is what a client will request.
        type: array
        minItems: 1
        items:
          type: string
          pattern: "^[a-z][a-z0-9+.-]*://.+$"

      digest:
        description: >-
          Whatever the platform publishes for this file, copied verbatim, or
          `null` when it publishes nothing -- molhub never computes one. The
          pattern applies only when a string is present.
        oneOf:
          - { type: "null" }
          - { type: string, pattern: "^md5:[0-9a-f]{32}$" }
          - { type: string, pattern: "^sha1:[0-9a-f]{40}$" }
          - { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
          - { type: string, pattern: "^sha512:[0-9a-f]{128}$" }

      size:
        description: Byte count, or `null`. Never `null` when `digest` is.
        type: [integer, "null"]
        exclusiveMinimum: 0
