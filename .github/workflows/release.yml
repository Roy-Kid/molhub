concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
name: release

'on':
  push:
    tags:
    - v*
  workflow_dispatch: null

permissions:
  contents: read
  id-token: write

jobs:
  context:
    permissions:
      contents: read
    name: release
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  build:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: release / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        registry-url: https://registry.npmjs.org
    - run: npm ci
    - run: npm run security:audit
    - run: uv sync --extra dev
    - run: npm run check
    - run: uv run pytest -q
    - run: npm run docs:check
    - run: npm run package:audit
    - name: Build isolated release artifacts
      run: |
        mkdir -p dist/python dist/npm
        uv build --out-dir dist/python
        npm pack --workspace @molcrafts/molhub --pack-destination dist/npm
    - uses: actions/upload-artifact@v4
      with:
        name: molhub-release-${{ github.sha }}
        path: dist/
        if-no-files-found: error

  publish:
    name: release / publish
    needs:
    - context
    - build
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: https://registry.npmjs.org
    - uses: actions/download-artifact@v4
      with:
        name: molhub-release-${{ github.sha }}
        path: dist/
    - name: Publish Python distribution
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/python/
    - name: Publish TypeScript distribution
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: npm publish dist/npm/*.tgz --access public --provenance
