name: web

'on':
  pull_request:
    branches:
    - dev
    - master
    - main
    paths:
    - apps/web/**
    - packages/typescript/**
    - packages/registry-tools/**
    - spec/**
    - package.json
    - package-lock.json
    - .github/assets/moko.svg
    - .github/workflows/web.yml
  push:
    branches:
    - '**'
    paths:
    - apps/web/**
    - packages/typescript/**
    - packages/registry-tools/**
    - spec/**
    - package.json
    - package-lock.json
    - .github/assets/moko.svg
    - .github/workflows/web.yml
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  context:
    permissions:
      contents: read
    name: web
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  checks:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: web / Lint, test, typecheck, prerender
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out MolHub
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the workspace
        run: npm ci

      - name: Validate and build the in-tree registry snapshot
        run: |
          npm run registry:validate
          npm run registry:build

      - name: Record the registry source revision
        run: echo "PUBLIC_MOLHUB_REGISTRY_REVISION=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Run Web gates
        env:
          MOLHUB_REGISTRY_JSON: ${{ github.workspace }}/.generated/registry/registry.json
        run: |
          npm run lint --workspace @molcrafts/molhub-web
          npm run test --workspace @molcrafts/molhub-web
          npm run typecheck --workspace @molcrafts/molhub-web
          npm run build --workspace @molcrafts/molhub-web

      - name: Check the prerendered site exists
        run: test -s apps/web/dist/client/index.html

      - name: Install the Inspector browser
        run: npx playwright install --with-deps chromium

      - name: Run the real-browser Inspector acceptance
        env:
          MOLHUB_REGISTRY_JSON: ${{ github.workspace }}/.generated/registry/registry.json
        run: npm run test:e2e --workspace @molcrafts/molhub-web

      - name: Retain Inspector screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-browser-${{ github.sha }}
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
