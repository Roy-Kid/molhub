concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}
name: docs

'on':
  pull_request:
    paths:
    - docs/**
    - src/**
    - scripts/check-docs-*
    - tests/test_docs_examples.py
    - zensical.toml
    - pyproject.toml
    - uv.lock
    - package.json
    - package-lock.json
    - typedoc.json
    - packages/typescript/src/**
    - .github/workflows/docs.yml
    branches:
    - dev
    - master
    - main
  push:
    branches:
    - '**'
    paths:
    - docs/**
    - src/**
    - scripts/check-docs-*
    - tests/test_docs_examples.py
    - zensical.toml
    - pyproject.toml
    - uv.lock
    - package.json
    - package-lock.json
    - typedoc.json
    - packages/typescript/src/**
    - .github/workflows/docs.yml
  workflow_dispatch: null

permissions:
  contents: read
  deployments: write

jobs:
  context:
    permissions:
      contents: read
    name: docs
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  build:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: docs / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --extra dev
      - run: npm ci
      - run: npm run docs:check
      - uses: actions/upload-artifact@v4
        with:
          name: molhub-docs-${{ github.sha }}
          path: site/
          if-no-files-found: error

  deploy:
    concurrency:
      group: docs-deploy-publication
      cancel-in-progress: false
    name: docs / deploy
    if: needs.context.outputs.deploy == 'true'
    needs:
    - context
    - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: molhub-docs-${{ github.sha }}
          path: site
      - name: Require the Docs Pages project
        env:
          PROJECT: ${{ vars.CLOUDFLARE_DOCS_PROJECT }}
        run: |
          if [ -z "$PROJECT" ]; then
            echo "::error::CLOUDFLARE_DOCS_PROJECT is unset."
            exit 1
          fi
      - name: Publish immutable docs build
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy site
            --project-name=${{ vars.CLOUDFLARE_DOCS_PROJECT }}
            --branch=${{ github.ref_name }}
