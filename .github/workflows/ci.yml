concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}
name: ci

'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - dev
    - master
    - main

jobs:
  context:
    permissions:
      contents: read
    name: ci
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  lint:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/
          uv run ty check src/

  test:
    if: needs.context.outputs.skip-pr != 'true'
    name: ci / test
    needs:
    - context
    - lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["3.12", "3.13", "3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest --cov=src/molhub --cov-report=term-missing --cov-report=xml -v
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python${{ matrix.python-version }}

  node:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / TypeScript, registry, API, and Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out MolHub
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python for cross-language conformance
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Install the workspace
        run: npm ci
      - name: Audit production dependencies
        run: npm run security:audit
      - name: Validate and build the in-tree registry database
        run: |
          npm run registry:validate
          npm run registry:build
      - name: Record the registry source revision
        run: echo "PUBLIC_MOLHUB_REGISTRY_REVISION=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Run every Node quality gate
        env:
          MOLHUB_REGISTRY_JSON: ${{ github.workspace }}/.generated/registry/registry.json
        run: npm run check
      - name: Build publishable outputs
        env:
          MOLHUB_REGISTRY_JSON: ${{ github.workspace }}/.generated/registry/registry.json
        run: |
          npm run build --workspace @molcrafts/molhub
          npm run deploy:dry --workspace @molcrafts/molhub-api
          npm run build --workspace @molcrafts/molhub-web

  docs-and-packages:
    needs:
    - context
    name: ci / Docs and package contents
    # Not part of the dev integration loop — docs/PyPI release stay on main/master.
    if: needs.context.outputs.skip-pr != 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --extra dev
      - run: npm ci
      - run: npm run docs:check
      - run: npm run package:audit

  workflow-policy:
    name: ci / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: MolCrafts/molcrafts-ci/actions/check-workflows@master
