name: web-deploy

'on':
  push:
    branches:
    - master
    paths:
    - apps/web/**
    - packages/typescript/**
    - packages/registry-tools/**
    - spec/**
    - package.json
    - package-lock.json
    - .github/assets/moko.svg
    - .github/workflows/web-deploy.yml
  repository_dispatch:
    types:
    - registry-published
  workflow_dispatch: null

permissions:
  contents: read
  deployments: write

concurrency:
  group: web-deploy-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    permissions:
      contents: read
    name: web-deploy
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  publish:
    concurrency:
      group: web-deploy-publish-publication
      cancel-in-progress: false
    if: needs.context.outputs.deploy == 'true'
    needs:
    - context
    name: web-deploy / Build against the registry and publish MolHub Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out MolHub
        uses: actions/checkout@v4

      - name: Check out the canonical registry database
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molhub-registry
          path: .registry-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the workspace
        run: npm ci

      - name: Validate and build the registry snapshot input
        run: |
          npm run registry:validate -- "$GITHUB_WORKSPACE/.registry-source/artifacts"
          npm run registry:build -- "$GITHUB_WORKSPACE/.registry-source/artifacts" "$GITHUB_WORKSPACE/.registry-source/dist"

      - name: Record the registry source revision
        run: echo "PUBLIC_MOLHUB_REGISTRY_REVISION=$(git -C .registry-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Require the submission API URL
        env:
          API_URL: ${{ vars.MOLHUB_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Repository variable MOLHUB_API_URL is unset."
            exit 1
          fi

      - name: Test and prerender the Web app
        env:
          MOLHUB_REGISTRY_JSON: ${{ github.workspace }}/.registry-source/dist/registry.json
          PUBLIC_MOLHUB_API_URL: ${{ vars.MOLHUB_API_URL }}
        run: |
          npm run test --workspace @molcrafts/molhub-web
          npm run typecheck --workspace @molcrafts/molhub-web
          npm run build --workspace @molcrafts/molhub-web

      - name: Check the publish directory
        run: test -s apps/web/dist/client/index.html

      - name: Require the Web Pages project name
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$PROJECT" ]; then
            echo "::error::Repository variable CLOUDFLARE_PAGES_PROJECT is unset."
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy apps/web/dist/client
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}
